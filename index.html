function handRenderer(hand) {
  function highlight(button) {
    for(const card of hand.children) card.classList.toggle('show',card===button);
  }
  let held=null;
  hand.onpointerdown=event=>{
    if(event.pointerType==='touch') return;
    const button=event.target.closest('.feature');
    if(!button || !button.classList.contains('is-link') || held || !event.isPrimary || event.button!==0) return;
    const translation=getComputedStyle(button).translate;
    const [dx=0,dy=0]=translation==='none'?[]:translation.split(' ').map(parseFloat);
    held={button,id:event.pointerId,x:event.clientX,y:event.clientY,dx,dy,moved:false};
    button.setPointerCapture(event.pointerId);
  };
  hand.onpointermove=event=>{
    if(held){
      if(event.pointerId!==held.id) return;
      const dx=event.clientX-held.x, dy=event.clientY-held.y;
      if(!held.moved && Math.hypot(dx,dy)<6) return;
      const button=held.button;
      if(!held.moved){
        held.moved=true;
        const face=button.querySelector('.face');
        face.style.transform=getComputedStyle(face).transform;
        hand.classList.add('pulling');
        button.classList.remove('returning');
        button.classList.add('sliding');
        highlight(button);
      }
      button.style.setProperty('--dx',held.dx+dx+'px');
      button.style.setProperty('--dy',held.dy+dy+'px');
      return;
    }
    if(event.pointerType==='touch') return;
    const face=event.target.closest('.face');
    if(face) highlight(face.closest('.feature'));
  };
  function dropFeature(event){
    if(!held || held.id!==event.pointerId) return;
    const {button,moved}=held;
    held=null;
    if(!moved) return;
    button.querySelector('.face').style.removeProperty('transform');
    button.classList.add('returning');
    button.style.setProperty('--dx','0px');
    button.style.setProperty('--dy','0px');
    const clean=()=>{
      if(held?.button===button || !button.classList.contains('returning')) return;
      button.classList.remove('sliding','returning');
      if(!hand.querySelector('.sliding')) hand.classList.remove('pulling');
    };
    Promise.allSettled(button.getAnimations().filter(a=>a.transitionProperty==='translate').map(a=>a.finished)).then(clean);
    if(event.type==='pointerup') button.addEventListener('click',e=>{e.stopImmediatePropagation();e.preventDefault()},{capture:true,once:true,signal:AbortSignal.timeout(400)});
  }
  hand.onpointerup=hand.onpointercancel=hand.onlostpointercapture=dropFeature;
  hand.onpointerleave=()=>!held && highlight(hand.contains(document.activeElement) && document.activeElement.matches(':focus-visible') ? document.activeElement : null);
  let closeTimer, lastSelection;
  return function renderHand(selection) {
    clearTimeout(closeTimer);
    const opening=selection!==null;
    if(hand.classList.contains('product-hand'))mobileCardHint.hidden=true;
    const card=cards[opening?selection:lastSelection];
    const remaining=card?Math.abs(Number(opening)-card.turn):0;
    const duration=reduced.matches?0:turnDurationMs*remaining;
    hand.style.setProperty('--motion-duration',duration+'ms');
    lastSelection=selection;
    held=null;
    hand.classList.remove('pulling');
    if(selection===null) {
      hand.inert=true;
      highlight(null);
      hand.classList.add('closing');
      const finish=()=>{hand.hidden=true;hand.replaceChildren()};
      if(duration===0) finish();
      else closeTimer=setTimeout(finish,duration);
      return;
    }
    hand.inert=false;
    hand.classList.remove('closing');
    hand.replaceChildren();
    hand.hidden=false;
    hand.classList.toggle('macos-hand',selection===0);
    hand.classList.toggle('career-hand',selection!==3);
    hand.classList.toggle('profile-hand',selection===3);
    hand.classList.toggle('custom-hand',selection===2);
    hand.classList.toggle('project-hand',selection===1);
    hand.classList.toggle('cs-hand',selection===2);
    hand.classList.toggle('english-hand',selection===1);
    const pack=features[selection];
    hand.style.setProperty('--gaps',pack.length-1);
    hand.style.setProperty('--fan-span',pack.length-(pack.length-1)*.05);
    hand.dataset.cardCount=pack.length;
    hand.setAttribute('aria-label',cards[selection].button.getAttribute('aria-label')+' 内容牌');
    pack.forEach(([label,color,tint],i)=>{
      const isProfileLink=selection===3&&!!profileEntries[i].url;
      const hasDetail=!isProfileLink;
      const button=document.createElement(isProfileLink?'a':'button');
      if(isProfileLink) {button.href=profileEntries[i].url;button.target='_blank';button.rel='noopener noreferrer';}
      else {button.type='button';button.setAttribute('aria-controls','service-details');button.setAttribute('aria-expanded','false');}
      button.className='feature';
      button.classList.add('is-link');
      button.setAttribute('aria-label',label);
      const offset=i-(pack.length-1)/2;
      button.style.setProperty('--gather-x',(-offset*35)+'%');
      const spread=selection===3?offset:offset/Math.max(1,(pack.length-1)/2);
      button.style.setProperty('--fan-shift',-spread/2);
      button.style.setProperty('--tilt',spread*(selection<=2?6:3)+'deg');
      button.style.setProperty('--dip',Math.abs(spread)*.9+'svh');
      button.style.setProperty('--order',i/Math.max(1,pack.length-1));
      button.style.setProperty('--delay','calc(var(--motion-duration) * .22 * var(--order))');
      button.style.setProperty('--color',color);
      button.style.setProperty('--tint',tint);
      const face=document.createElement('span');
      face.className='face';
      if(isProfileLink||hasDetail) {
        const hint=document.createElement('span');hint.className='card-link-hint';
        hint.textContent=isProfileLink?'↗':'↓';hint.setAttribute('aria-hidden','true');face.append(hint);
      }
      if(selection!==3) {
        const service=serviceGroups[selection][i];
        face.classList.add('career-face');
        const art=document.createElement('img');art.className='career-card-art';
        art.src=service.image;art.alt=service.alt;art.width=1280;art.height=1024;art.decoding='async';art.draggable=false;
        face.append(art);
      } else if(selection===3) {
        face.classList.add('profile-face');
        const art=document.createElement('img');art.className='career-card-art';
        art.src=profileEntries[i].image;art.alt=label+'：'+profileEntries[i].summary;
        art.width=1200;art.height=960;art.decoding='async';art.draggable=false;
        face.append(art);
      } else {
        const caption=document.createElement('span');
        caption.className='fan-caption';
        caption.textContent=label;
        const content=document.createElement('span');
        content.className='scene business-copy';
        content.textContent='内容整理中';
        face.append(caption,content);
      }
      button.append(face);
      button.onfocus=()=>highlight(button);
      button.onblur=()=>highlight(null);
      if(hasDetail)button.onclick=()=>openServiceDetail(selection,i,button);

      hand.append(button);
    });
    highlight(null);
    hand.classList.add('reveal');
  };
}

const detailSection=document.querySelector('.service-details');
function fillServiceDetail(key) {
  const page=detailPages[key];
  if(!page)return;
  const put=(selector,text)=>{detailSection.querySelector(selector).textContent=text;};
  put('.story-category',page.category);put('.story-title',page.title);
  put('.story-hook',page.hook);put('.story-intro',page.intro);
  put('.story-bring','带来这些就可以：'+page.bring);
  put('.story-delivery-title',page.delivery);put('.story-note',page.note);
  put('.story-prompt',page.prompt);put('.plan-contact',page.cta+' ↗');
  const steps=detailSection.querySelector('.story-steps');steps.replaceChildren();
  page.work.forEach(([title,copy],i)=>{
    const li=document.createElement('li');
    const n=document.createElement('span');n.className='story-step-number';n.textContent='0'+(i+1);
    const group=document.createElement('div');const h=document.createElement('h3');h.textContent=title;
    const p=document.createElement('p');p.textContent=copy;group.append(h,p);li.append(n,group);steps.append(li);
  });
  const results=detailSection.querySelector('.story-results');results.replaceChildren();
  page.results.forEach(([title,copy])=>{
    const row=document.createElement('div');const dt=document.createElement('dt');dt.textContent=title;
    const dd=document.createElement('dd');dd.textContent=copy;row.append(dt,dd);results.append(row);
  });
  detailSection.querySelector('.service-story').scrollTop=0;
}

function openServiceDetail(selection,index,origin) {
  cancelPreviewClose();
  pinnedProduct=selection;
  document.querySelectorAll('.feature[aria-controls="service-details"]').forEach(e=>e.setAttribute('aria-expanded',String(e===origin)));
  const title=features[selection][index][0];
  detailSection.setAttribute('aria-label',title+'详情');
  detailSection.dataset.service=selection+'-'+index;
  fillServiceDetail(selection+'-'+index);
  detailSection.querySelector('.plan-contact-status').textContent='';
  detailSection.hidden=false;
  detailSection.focus({preventScroll:true});
  detailSection.scrollIntoView({behavior:reduced.matches?'instant':'smooth',block:'start'});
}
document.querySelector('.plan-contact').onclick=async()=>{
  const status=document.querySelector('.plan-contact-status');
  try {
    await navigator.clipboard.writeText(contactWechat);
    status.textContent='已复制微信 '+contactWechat+'。添加时请注明来意。';
  } catch {
    status.textContent='微信：'+contactWechat+'。可选中复制，添加时请注明来意。';
  }
};
for(const c of cards) {
  c.button.onclick=()=>activate(c);
  c.unit.addEventListener('pointerenter',event=>{
    if(event.pointerType==='touch')return;
    cancelPreviewClose();displayProduct(c.index);
    if(c.index===3) {showContactBubble(contactWechat?contactWelcome:'欢迎访问网站，一起聊聊你的需求。');setTimeout(positionContactBubble,500);}
  });
  c.unit.addEventListener('pointerleave',event=>{
    if(event.pointerType!=='touch')schedulePreviewClose();
  });
  c.button.addEventListener('focus',()=>layout());
  c.button.addEventListener('blur',()=>layout());
  c.button.addEventListener('keydown',event=>{
    if(event.key==='Escape') {setOpen(c,false);c.button.blur();layout();}
  });
}
contactBubble.addEventListener('pointerenter',cancelPreviewClose);
contactBubble.addEventListener('pointerleave',event=>{if(event.pointerType!=='touch')schedulePreviewClose()});
const productHand=document.querySelector('.product-hand');
productHand.addEventListener('pointerenter',cancelPreviewClose);
productHand.addEventListener('pointerleave',event=>{
  if(event.pointerType!=='touch')schedulePreviewClose();
});
document.addEventListener('click',event=>{
  if(!event.target.closest('.stage'))return;
  if(event.target.closest('.unit,.feature,.contact-bubble,dialog,a,button'))return;
  cancelPreviewClose();
  pinnedProduct=null;
  if(document.activeElement?.closest('.unit'))document.activeElement.blur();
  displayProduct(null);
  layout();
});
layout(true);
new ResizeObserver(()=>layout()).observe(stage);
